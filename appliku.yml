# Appliku deploy config. Import via App → YAML Config, or keep in sync with dashboard export.
# Build: multi-stage root Dockerfile (frontend + Python). Do not set a separate npm build_command.
# Build peak RAM: Dockerfile sets npm_config_jobs=2 and NODE_OPTIONS heap cap in the frontend stage only.
# Runtime: single Daphne process (run.sh) — not multi-worker Gunicorn.
#
# Deploy downtime: standalone Appliku replaces one web container (stop-then-start) — expect a
# short gap (often 30–90s) while Daphne cold-starts. For near zero-downtime, use a Docker Swarm
# cluster and set web.scale to 2 (needs ~2× web RAM). Do not set scale: 2 on standalone compose
# without Swarm load balancing.
#
# Postgres and Redis are NOT provisioned here — keep your existing Appliku addons and URLs in
# Environment Variables (DATABASE_URL, REDIS_URL). To wire YAML to addons by name instead, export
# config from the dashboard and use from_database with your addon's exact name.

build_settings:
  build_image: dockerfile
  dockerfile_path: Dockerfile
  container_port: 8000
  skip_release_command: false
  environment_variables:
    - name: ALLOWED_HOSTS
      from_domains: true
    - name: DATABASE_URL
      source: manual
    - name: REDIS_URL
      source: manual
    - name: DEBUG
      value: "false"
    - name: SECRET_KEY
      source: manual
    - name: VITE_AUTH0_DOMAIN
      source: manual
    - name: VITE_AUTH0_CLIENT_ID
      source: manual
    - name: VITE_AUTH0_API_AUDIENCE
      source: manual
    # Recommendations map (Maps Static API). Runtime env — injected into HTML shell (not Vite build).
    - name: VITE_GOOGLE_MAPS_API_KEY
      source: manual
    # Recommendations geocode (Geocoding API). Server IP–restricted key recommended.
    - name: GOOGLE_MAPS_SERVER_API_KEY
      source: manual
    # Sentry (optional). Production only (DEBUG=false). Same DSN for Django + browser SPA.
    - name: SENTRY_DSN
      source: manual
    - name: SENTRY_ENVIRONMENT
      source: manual
    - name: SENTRY_TRACES_SAMPLE_RATE
      source: manual
    # ArborBot (Song-a-Day Slack bot). Omit all SLACK_* to disable. Do not use Auth0 Slack OAuth for this.
    - name: SLACK_SIGNING_SECRET
      source: manual
    - name: SLACK_BOT_TOKEN
      source: manual
    - name: SLACK_PROMPTS_CHANNEL_ID
      source: manual
    - name: SLACK_SONGADAY_CHANNEL_ID
      source: manual
      # Optional: events listen channel. Falls back to SLACK_PROMPTS_CHANNEL_ID when unset.
    - name: SLACK_DEBUG_CHANNEL_ID
      source: manual
      # Optional: private debug channel for ingest failures (ops visibility).
    - name: SONGADAY_SLACK_PROMPT_TIMEZONE
      source: manual
    - name: SLACK_CREATE_ACCOUNT_URL
      value: "https://www.pondarbor.com/"
    - name: PUBLIC_SITE_ORIGIN
      value: "https://www.pondarbor.com"

services:
  web:
    command: bash run.sh
    scale: 1
    # Swarm cluster only (not standalone): use scale: 2 for rolling deploys (~220 MiB web RAM).
  release:
    command: bash release.sh

commands:
  - python3 /app/backend/manage.py migrate
  - python3 /app/backend/manage.py collectstatic --noinput
  - env | grep -i database
