services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/users/health/', timeout=3).getcode() == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      # Isolated from host; can go stale if package.json/lockfile changes. Re-sync on start:
      - /app/node_modules
    command: sh -c "npm install && exec npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
