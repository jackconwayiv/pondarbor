services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      # Isolated from host; can go stale if package.json/lockfile changes. Re-sync on start:
      - /app/node_modules
    command: sh -c "npm install && exec npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - backend
