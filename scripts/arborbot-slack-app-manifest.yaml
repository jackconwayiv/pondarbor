# Slack app manifest for ArborBot (Song-a-Day + Closet).
# Import: https://api.slack.com/apps → Create New App → From an app manifest
#
# After import:
# 1. Install app to workspace → copy Bot User OAuth Token (xoxb-…) → SLACK_BOT_TOKEN
# 2. Basic Information → Signing Secret → SLACK_SIGNING_SECRET
# 3. Invite @ArborBot to #song-a-day and #closet (and prompts channel if separate)
# 4. Copy #song-a-day channel ID (C…) into SLACK_PROMPTS_CHANNEL_ID
#    (SLACK_SONGADAY_CHANNEL_ID only if submissions are in a different channel)
#    Copy #closet channel ID into SLACK_CLOSET_CHANNEL_ID (must differ from Song-a-Day)
# 5. Set env vars on Appliku (see appliku.yml / README)
#
# Replace https://www.pondarbor.com with your production origin before import if different.

_metadata:
  major_version: 1
  minor_version: 2

display_information:
  name: ArborBot
  description: Song-a-Day, Quotes, and Closet for PondArbor
  background_color: "#1a365d"

features:
  bot_user:
    display_name: ArborBot
    always_online: true
  slash_commands:
    - command: /song
      url: https://www.pondarbor.com/api/v1/slack/commands/
      description: Submit your Song-a-day pick for today
      usage_hint: "[youtube, spotify, or apple music url]"
      should_escape: false
    - command: /prompt
      url: https://www.pondarbor.com/api/v1/slack/commands/
      description: Post today's Song-a-day prompt to the channel
      usage_hint: ""
      should_escape: false
    - command: /quote
      url: https://www.pondarbor.com/api/v1/slack/commands/
      description: Save a quote to your PondArbor account
      usage_hint: "[quote text] -[attribution]"
      should_escape: false
    - command: /randomquote
      url: https://www.pondarbor.com/api/v1/slack/commands/
      description: Post a random published quote from PondArbor
      usage_hint: ""
      should_escape: false
    - command: /closet
      url: https://www.pondarbor.com/api/v1/slack/commands/
      description: DM your Closet inbox (pending actions)
      usage_hint: ""
      should_escape: false
    - command: /loans
      url: https://www.pondarbor.com/api/v1/slack/commands/
      description: DM your loans and custody holdings summary
      usage_hint: ""
      should_escape: false
    - command: /pondarbor
      url: https://www.pondarbor.com/api/v1/slack/commands/
      description: Opt in or out of ArborBot DMs
      usage_hint: "[on|off]"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history
      - groups:history
      - commands
      - im:write
      - users:read
      - users:read.email

settings:
  interactivity:
    is_enabled: true
    request_url: https://www.pondarbor.com/api/v1/slack/interactions/
  event_subscriptions:
    request_url: https://www.pondarbor.com/api/v1/slack/events/
    bot_events:
      - message.channels
      - message.groups
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  is_hosted: false
